name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Secrets must never reach the client bundle.
      - name: Check bundle for leaked secrets
        run: |
          if grep -rEl "service_role|sbp_[A-Za-z0-9]{20,}|re_[A-Za-z0-9_]{20,}" dist/ ; then
            echo "::error::A secret-shaped string was found in the build output"
            exit 1
          fi
          echo "No secrets found in dist/"
