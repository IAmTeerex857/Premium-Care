name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint, type-check, and test
        run: npm run check
      - name: Build
        run: npm run build
      - name: Validate deployment files
        run: |
          node -e "JSON.parse(require('node:fs').readFileSync('vercel.json', 'utf8'))"
          test -s dist/robots.txt
          test -s dist/sitemap.xml
      - name: Check bundle for leaked secrets
        run: |
          if grep -rEl "service_role|sbp_[A-Za-z0-9]{20,}|re_[A-Za-z0-9_]{20,}" dist/; then
            echo "::error::A secret-shaped string was found in the build output"
            exit 1
          fi
          echo "No secrets found in dist/"
